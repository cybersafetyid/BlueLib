# Version published to Maven Central. `verifyVersionConsistency` keeps this and
# BlueLibVersion.VERSION in agreement, and the release workflow passes the tag value explicitly.
bluelib.version=0.2.0

# Android Lint over the sample app needs more than Gradle's default 384 MB Metaspace and crashes
# with "Metaspace" otherwise. CI and the release workflow read this file too.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
