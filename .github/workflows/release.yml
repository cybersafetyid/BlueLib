name: Release

# Releases are cut from tags, never from a branch: the tag is the only thing that can be reproduced
# later, and Maven Central never forgets an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match BlueLibVersion.VERSION)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v3 of this action installs the `tools` package, which the SDK repository no longer serves, so
      # the action fails before the build even starts. v4 installs only `platform-tools`.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install the Android 17 platform and build tools
        run: |
          sdkmanager --install \
            "build-tools;36.1.0" \
            "platform-tools"
          sdkmanager --install "platforms;android-37.0" || sdkmanager --install "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before anything else runs. An unset secret expands to an empty string, and the signing
      # plugin's complaint about it is far less useful than "SIGNING_IN_MEMORY_KEY is not set".
      - name: Verify the release secrets are configured
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: |
          missing=""
          if [ -z "$SIGNING_KEY" ]; then missing="$missing SIGNING_IN_MEMORY_KEY"; fi
          if [ -z "$PORTAL_TOKEN" ]; then missing="$missing CENTRAL_PORTAL_TOKEN"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/releasing.md#one-time-setup"
            exit 1
          fi
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::warning::SIGNING_IN_MEMORY_KEY_PASSWORD is empty; assuming the key has no passphrase."
          fi
          echo "Release secrets are present."

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The published version and the constant compiled into the artifacts must agree, otherwise a bug
      # report can never be traced back to a release.
      - name: Assert BlueLibVersion matches the tag
        run: |
          ./gradlew -Pbluelib.version="${{ steps.version.outputs.value }}" verifyVersionConsistency

      - name: Check
        run: ./gradlew check

      # A stale staging directory would end up inside the Central bundle, and Central rejects bundles
      # that contain an unexpected version. Start from an empty one.
      - name: Clean the staging directory
        run: rm -rf build/staging-deploy

      - name: Publish signed artifacts to the staging directory
        env:
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          ./gradlew \
            -Pbluelib.version="${{ steps.version.outputs.value }}" \
            -PsigningInMemoryKey="$SIGNING_IN_MEMORY_KEY" \
            -PsigningInMemoryKeyPassword="$SIGNING_IN_MEMORY_KEY_PASSWORD" \
            publishAllPublicationsToStagingRepository

      - name: Bundle the staging repository
        run: |
          cd build/staging-deploy
          zip -r "$GITHUB_WORKSPACE/central-bundle.zip" .
        working-directory: .

      # The token is the base64 of "username:password" from the Portal's Account page ("Generate User
      # Token"), used as a Bearer value. The upload answers with a deployment id, which is the only way
      # to ask what happened to the bundle afterwards.
      - name: Upload to the Maven Central Portal
        id: portal
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_ID=$(curl -sS --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $CENTRAL_TOKEN" \
            -F "bundle=@central-bundle.zip" \
            -F "name=${{ github.repository }}-${{ steps.version.outputs.value }}" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED")
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::Central accepted the bundle as deployment $DEPLOYMENT_ID"

      # USER_MANAGED means the bundle is validated and then waits for a human to publish it on the
      # Portal. That is deliberate for a first release: a published Maven Central version can never be
      # replaced, and the poll below is what turns "uploaded" into a definite answer. Change the
      # publishingType above to AUTOMATIC for hands-off releases once the metadata is known to pass.
      - name: Wait for the deployment to validate or publish
        if: steps.portal.outputs.deployment_id != ''
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.portal.outputs.deployment_id }}
        run: |
          set -euo pipefail
          DEADLINE=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            BODY=$(curl -sS --fail-with-body \
              -X POST \
              -H "Authorization: Bearer $CENTRAL_TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")
            STATE=$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState", ""))')
            echo "deploymentState=$STATE"
            case "$STATE" in
              PUBLISHED)
                echo "::notice::BlueLib ${{ steps.version.outputs.value }} is published to Maven Central."
                exit 0
                ;;
              # The expected end state with publishingType=USER_MANAGED: valid, and waiting for a
              # human to press publish on https://central.sonatype.com/publishing/deployments
              VALIDATED)
                echo "::warning::The bundle passed validation. Publish v${{ steps.version.outputs.value }} at https://central.sonatype.com/publishing/deployments"
                exit 0
                ;;
              FAILED)
                echo "::error::The Central deployment failed validation. Validator errors:"
                printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin).get("errors", []), indent=2))'
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "::warning::The deployment is still not published after 15 minutes. Check https://central.sonatype.com/publishing/deployments"

      # The release page mirrors CHANGELOG.md, so the changelog stays the single source of truth for what
      # changed in a version. A version without a changelog section must not be released.
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { p = 1; next } /^## \[/ { p = 0 } p' CHANGELOG.md \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no entry for version $VERSION. Add a '## [$VERSION]' section first."
            exit 1
          fi

      - name: Attach the bundle to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: central-bundle.zip
          body_path: release-notes.md
          generate_release_notes: false
