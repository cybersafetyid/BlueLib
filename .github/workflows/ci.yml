name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx3g
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # AGP 9.1.1 or newer is required: BlueLib compiles against API 37 (Android 17).
      - name: Install platform and build tools
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check (tests, lint, domain purity)
        run: ./gradlew check --stacktrace

      - name: Publish to a local staging repository
        run: ./gradlew publishAllPublicationsToStagingRepository

      - name: Verify the compatibility matrix is up to date
        run: |
          ./gradlew generateCompatibilityMatrix
          if ! git diff --quiet -- docs/compatibility-matrix.md; then
            echo "::error::docs/compatibility-matrix.md is stale. Run ./gradlew generateCompatibilityMatrix and commit the result."
            git diff --stat -- docs/compatibility-matrix.md
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Build the site strictly
        run: mkdocs build --strict
